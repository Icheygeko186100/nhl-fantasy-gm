<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>NHL Fantasy GM — Live Scoreboard, Salary Cap & Multiplayer Draft</title>
  <meta name="description" content="NHL Fantasy GM Progressive Web App for iOS & Web. Live NHL scoreboard, 794 active NHL players, CAD salary cap valuation engine, and cross-platform multiplayer draft rooms." />

  <!-- iOS / Apple Home Screen PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NHL GM" />
  <meta name="theme-color" content="#0D1424" />
  <meta name="format-detection" content="telephone=no" />

  <!-- Icons & Manifest -->
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div id="app-shell">
    <header class="top-header" id="top-header-container"></header>
    <div id="sub-tab-container"></div>
    <main id="main-content">
      <div class="main-scroll" style="display:flex;align-items:center;justify-content:center;height:100%;">
        <div style="text-align:center;color:#94A3B8;font-size:14px;">
          <div style="font-size:32px;margin-bottom:8px;">🏒</div>
          <div style="font-weight:800;color:#F8FAFC;">Loading NHL Fantasy GM...</div>
          <div style="font-size:12px;margin-top:4px;">Initializing 32 NHL teams &amp; 794 active players</div>
        </div>
      </div>
    </main>
    <nav class="bottom-nav" id="bottom-nav-container"></nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast-container"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
